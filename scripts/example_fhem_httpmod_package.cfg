###############################################################################
# Import-ready FHEM HTTPMOD example for alexa-cookie-service with packages.
#
# Paste this into FHEMWEB -> Add Raw definition, then adjust if needed:
#   - attr AlexaCookieService echodevice AlexaAccount
#   - base URL via attr baseUrl if needed
#   - interval 57600 if needed
#
# Requirements:
#   1. HTTPMOD is installed in FHEM.
#   2. The Perl packages are available below /opt/fhem/lib/FHEM/AlexaCookieService/.
#   3. Store the service token after import:
#      set AlexaCookieService storeKeyValue alexa_cookie_service_token <your-token>
#
# Behavior:
#   - The normal HTTPMOD interval runs POST /api/cookie/refresh?save=<dynamic NR file>.
#   - <dynamic NR file> is computed by EchodeviceImport.pm from attr echodevice.
#   - After a successful refresh/export response, HTTPMOD triggers the echodevice import.
#   - get loginUrl starts the proxy login flow and stores the clickable URL as reading.
###############################################################################

# Periodic main request: refresh every 16h. requestData makes this a POST.
define AlexaCookieService HTTPMOD %%ACS_BASEURL%%/api/cookie/refresh?save=%%ACS_EXPORT_NAME%% 57600
attr AlexaCookieService room Amazon
attr AlexaCookieService userattr echodevice baseUrl
attr AlexaCookieService baseUrl http://alexa-cookie-service:58080
attr AlexaCookieService echodevice AlexaAccount
attr AlexaCookieService timeout 30
attr AlexaCookieService showError 1
attr AlexaCookieService showMatched 1
attr AlexaCookieService requestHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService requestHeader2 Content-Type: application/json
attr AlexaCookieService requestData {}

# Base URL replacement. Override attr baseUrl if the service is not reachable on the default host.
attr AlexaCookieService replacement03Mode expression
attr AlexaCookieService replacement03Regex %%ACS_BASEURL%%
attr AlexaCookieService replacement03Value AttrVal($name,"baseUrl","")

# Shared headers for all manual get/set requests.
attr AlexaCookieService getHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService setHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService setHeader2 Content-Type: application/json

# Token replacement. Store the real token via:
# set AlexaCookieService storeKeyValue alexa_cookie_service_token <your-token>
attr AlexaCookieService replacement01Mode key
attr AlexaCookieService replacement01Regex %%ACS_TOKEN%%
attr AlexaCookieService replacement01Value alexa_cookie_service_token

# Dynamic echodevice export filename, evaluated immediately before each request.
attr AlexaCookieService replacement02Mode expression
attr AlexaCookieService replacement02Regex %%ACS_EXPORT_NAME%%
attr AlexaCookieService replacement02Value FHEM::AlexaCookieService::EchodeviceImport::export_name_for_device(AttrVal($name,"echodevice",""))

# Manual commands.
attr AlexaCookieService get01Name status
attr AlexaCookieService get01URL %%ACS_BASEURL%%/api/status
attr AlexaCookieService get01NoData 1

attr AlexaCookieService get02Name loginUrl
attr AlexaCookieService get02URL %%ACS_BASEURL%%/api/cookie/login/url
attr AlexaCookieService get02NoData 1

attr AlexaCookieService get03Name exportCookie
attr AlexaCookieService get03URL %%ACS_BASEURL%%/api/cookie?save=%%ACS_EXPORT_NAME%%
attr AlexaCookieService get03NoData 1

attr AlexaCookieService set01Name refresh
attr AlexaCookieService set01NoArg 1
attr AlexaCookieService set01URL %%ACS_BASEURL%%/api/cookie/refresh?save=%%ACS_EXPORT_NAME%%
attr AlexaCookieService set01Method POST
attr AlexaCookieService set01Data {}
attr AlexaCookieService set01ParseResponse 1

attr AlexaCookieService set02Name loginStart
attr AlexaCookieService set02NoArg 1
attr AlexaCookieService set02URL %%ACS_BASEURL%%/api/cookie/login/start
attr AlexaCookieService set02Method POST
attr AlexaCookieService set02Data {}
attr AlexaCookieService set02ParseResponse 1

# Safe explicit readings only. Do not use extractAllJSON here because /api/cookie
# can contain cookie, csrf and refreshToken secrets.
attr AlexaCookieService reading01Name refresh_message
attr AlexaCookieService reading01JSON message

attr AlexaCookieService reading02Name export_name
attr AlexaCookieService reading02JSON saveTarget
attr AlexaCookieService reading02OExpr BEGIN { require FHEM::AlexaCookieService::EchodeviceImport;; };; $val || FHEM::AlexaCookieService::EchodeviceImport::export_name_for_device(AttrVal($name,"echodevice","")) || ""


# Import after successful refresh response. The reading value becomes ok or an error text.
attr AlexaCookieService reading03Name import_result
attr AlexaCookieService reading03JSON saveTarget
attr AlexaCookieService reading03OExpr $val ? (FHEM::AlexaCookieService::EchodeviceImport::trigger_import_for_device(AttrVal($name,"echodevice","")) || "ok") : "skipped"

# Import after manual get exportCookie. serviceUpdatedAt exists in /api/cookie responses.
attr AlexaCookieService reading04Name export_import_result
attr AlexaCookieService reading04JSON serviceUpdatedAt
attr AlexaCookieService reading04OExpr $val ? (FHEM::AlexaCookieService::EchodeviceImport::trigger_import_for_device(AttrVal($name,"echodevice","")) || "ok") : "skipped"

# Status/login readings.
attr AlexaCookieService reading10Name service_ok
attr AlexaCookieService reading10JSON ok
attr AlexaCookieService reading11Name service_updated_at
attr AlexaCookieService reading11JSON updatedAt
attr AlexaCookieService reading12Name service_age_hours
attr AlexaCookieService reading12JSON ageHours
attr AlexaCookieService reading13Name cookie_available
attr AlexaCookieService reading13JSON hasCookie
attr AlexaCookieService reading14Name refresh_available
attr AlexaCookieService reading14JSON hasRefreshToken
attr AlexaCookieService reading15Name amazon_page
attr AlexaCookieService reading15JSON amazonPage
attr AlexaCookieService reading16Name login_url
attr AlexaCookieService reading16JSON proxyUrl
attr AlexaCookieService reading17Name last_error
attr AlexaCookieService reading17JSON error

attr AlexaCookieService reading18Name refresh_code
attr AlexaCookieService reading18JSON code

attr AlexaCookieService reading19Name refresh_action
attr AlexaCookieService reading19JSON code
attr AlexaCookieService reading19OExpr $val eq "NO_STATE" ? "Start Login Flow." : ($val ? "Refresh failed: $val" : "")

# Show the login prompt only while it is newer than the last persisted service state.
attr AlexaCookieService stateFormat {my $msg=ReadingsVal($name,"refresh_message","");; my $act=ReadingsVal($name,"refresh_action","");; my $err=ReadingsVal($name,"last_error","");; my $age=ReadingsVal($name,"service_age_hours",ReadingsVal($name,"ageHours",""));; my $imp=ReadingsVal($name,"import_result","");; $msg ne "" ? $msg : $act ne "" ? $act : $err ne "" ? "error: $err" : $age ne "" ? "age ${age}h" : ($imp ne "" && $imp ne "ok" ? "refresh/import: $imp" : "")}
