###############################################################################
# FHEM HTTPMOD example for alexa-cookie-service with packages.
#
# This example fetches the export over HTTPS and passes the response to the
# package callback. The callback writes the JSON body to the local echodevice
# export file before triggering the import. That keeps the preferred flow
# independent of shared filesystems and does not require a 99_myUtils helper.
# Keep save=<filename> only for legacy compatibility with shared export paths.
#
# Paste this into FHEMWEB -> Add Raw definition, then adjust if needed:
#   - attr AlexaCookieService echodevice AlexaAccount
#   - base URL via attr baseUrl if needed
#
# Interval rules (checked by the interval_check reading, see README):
#   - The define interval only paces the cheap /api/status poll. The service
#     refreshes once its state is older than REFRESH_MIN_AGE_HOURS, so the real
#     refresh cadence is that age rounded up to the next poll.
#   - get03PollDelay (seconds) limits how often the export is fetched and
#     imported. Set it to REFRESH_MIN_AGE_HOURS in seconds. HTTPMOD documents an
#     "x6" form but evaluates it as 0, so always use seconds. The effective delay
#     is a multiple of the define interval.
#   - Set the echodevice attribute npm_refresh_intervall (on the echodevice
#     account device, not on HTTPMOD) very high, for example 2592000. In an ACS
#     setup echodevice cannot refresh locally; when the COOKIE reading gets older
#     than this value it only tries a local NPM refresh and logs errors.
#   - attr timeout must cover a refresh, because /api/status refreshes synchronously.
#
# Requirements:
#   1. HTTPMOD is installed in FHEM.
#   2. The Perl packages are available below /opt/fhem/lib/FHEM/AlexaCookieService/.
#   3. Store the service token after import:
#      set AlexaCookieService storeKeyValue alexa_cookie_service_token <your-token>
###############################################################################

# Periodic main request: status polling only. When the service state is
# older than the configured minimum age, /api/status refreshes it before
# responding. The export is fetched by get exportCookie, which is part of the
# update cycle (get03Poll) and can also be run manually.
define AlexaCookieService HTTPMOD %%ACS_BASEURL%%/api/status 3600
attr AlexaCookieService room Amazon
attr AlexaCookieService userattr echodevice baseUrl
attr AlexaCookieService baseUrl https://alexa-cookie-service:58080
# TLS: FHEM must trust the service CA instead of disabling verification.
# Example local-CA flow:
# attr AlexaCookieService sslArgs SSL_ca_file=/opt/fhem/ssl/alexa-cookie-service-ca.crt,SSL_verify_mode=1
# Example external-leaf flow:
# attr AlexaCookieService sslArgs SSL_ca_file=/opt/fhem/ssl/acs-leaf-ca.crt,SSL_verify_mode=1
# Copy or mount the CA file into a path that the FHEM container can read.
attr AlexaCookieService echodevice AlexaAccount
attr AlexaCookieService timeout 60
attr AlexaCookieService showError 1
attr AlexaCookieService showMatched 1
attr AlexaCookieService requestHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService requestHeader2 Content-Type: application/json

# Load the package while extracting any reading, before parseFunction2 runs.
attr AlexaCookieService readingOExpr BEGIN { require FHEM::AlexaCookieService::EchodeviceImport;; };; $val

# Pass complete HTTP responses to the package adapter. The adapter ignores
# status/login/refresh responses and handles only the top-level /api/cookie
# export schema.
attr AlexaCookieService parseFunction2 FHEM::AlexaCookieService::EchodeviceImport::httpmod_write_cookie_export_and_trigger_import

# Base URL replacement. Override attr baseUrl if the service is not reachable on the default host.
attr AlexaCookieService replacement03Mode expression
attr AlexaCookieService replacement03Regex %%ACS_BASEURL%%
attr AlexaCookieService replacement03Value AttrVal($name,"baseUrl","")

# Shared headers for all manual get/set requests.
attr AlexaCookieService getHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService setHeader1 x-auth-token: %%ACS_TOKEN%%
attr AlexaCookieService setHeader2 Content-Type: application/json

# Token replacement. Store the real token via:
# set AlexaCookieService storeKeyValue alexa_cookie_service_token <your-token>
attr AlexaCookieService replacement01Mode key
attr AlexaCookieService replacement01Regex %%ACS_TOKEN%%
attr AlexaCookieService replacement01Value alexa_cookie_service_token

# Dynamic echodevice export filename, evaluated immediately before each request.
attr AlexaCookieService replacement02Mode expression
attr AlexaCookieService replacement02Regex %%ACS_EXPORT_NAME%%
attr AlexaCookieService replacement02Value FHEM::AlexaCookieService::EchodeviceImport::export_name_for_device(AttrVal($name,"echodevice",""))

# Manual commands.
attr AlexaCookieService get01Name status
attr AlexaCookieService get01URL %%ACS_BASEURL%%/api/status
attr AlexaCookieService get01NoData 1

attr AlexaCookieService get02Name loginUrl
attr AlexaCookieService get02URL %%ACS_BASEURL%%/api/cookie/login/url
attr AlexaCookieService get02NoData 1

attr AlexaCookieService get03Name exportCookie
attr AlexaCookieService get03URL %%ACS_BASEURL%%/api/cookie
attr AlexaCookieService get03Poll 1
attr AlexaCookieService get03PollDelay 21600

attr AlexaCookieService set01Name refresh
attr AlexaCookieService set01NoArg 1
attr AlexaCookieService set01URL %%ACS_BASEURL%%/api/cookie/refresh
attr AlexaCookieService set01Method POST
attr AlexaCookieService set01Data {}
attr AlexaCookieService set01ParseResponse 1

attr AlexaCookieService set02Name loginStart
attr AlexaCookieService set02NoArg 1
attr AlexaCookieService set02URL %%ACS_BASEURL%%/api/cookie/login/start
attr AlexaCookieService set02Method POST
attr AlexaCookieService set02Data {}
attr AlexaCookieService set02ParseResponse 1

# Safe explicit readings only. Do not use extractAllJSON here because /api/cookie
# can contain cookie, csrf and refreshToken secrets.
attr AlexaCookieService reading01Name refresh_message
attr AlexaCookieService reading01JSON message

attr AlexaCookieService reading02Name export_name
attr AlexaCookieService reading02OExpr BEGIN { require FHEM::AlexaCookieService::EchodeviceImport;; };; $val || FHEM::AlexaCookieService::EchodeviceImport::export_name_for_device(AttrVal($name,"echodevice","")) || ""

# The export fetch response contains cookie secrets. Do not extract the complete
# response into readings. The package callback receives the body directly.
attr AlexaCookieService reading03Name export_updated_at
attr AlexaCookieService reading03JSON serviceUpdatedAt

# Status/login readings.
attr AlexaCookieService reading10Name service_ok
attr AlexaCookieService reading10JSON ok
attr AlexaCookieService reading11Name service_updated_at
attr AlexaCookieService reading11JSON updatedAt
attr AlexaCookieService reading12Name service_age_hours
attr AlexaCookieService reading12JSON ageHours
attr AlexaCookieService reading13Name cookie_available
attr AlexaCookieService reading13JSON hasCookie
attr AlexaCookieService reading14Name refresh_available
attr AlexaCookieService reading14JSON hasRefreshToken
attr AlexaCookieService reading15Name amazon_page
attr AlexaCookieService reading15JSON amazonPage
attr AlexaCookieService reading16Name login_url
attr AlexaCookieService reading16JSON proxyUrl
attr AlexaCookieService reading17Name last_error
attr AlexaCookieService reading17JSON error

attr AlexaCookieService reading18Name refresh_code
attr AlexaCookieService reading18JSON code

attr AlexaCookieService reading19Name refresh_action
attr AlexaCookieService reading19JSON code
attr AlexaCookieService reading19OExpr $val eq "NO_STATE" ? "Start Login Flow." : ($val ? "Refresh failed: $val" : "")

# Interval compatibility check of define interval, get03PollDelay, timeout and the
# echodevice attribute npm_refresh_intervall against the service's
# REFRESH_MIN_AGE_HOURS. Reads "ok", "warning: <codes>" or "error: <codes>".
# Details: {FHEM::AlexaCookieService::IntervalCheck::report_for_devices("AlexaCookieService","AlexaAccount")}
attr AlexaCookieService reading20Name service_refresh_min_age_hours
attr AlexaCookieService reading20JSON refreshMinAgeHours
attr AlexaCookieService reading21Name interval_check
attr AlexaCookieService reading21JSON refreshMinAgeHours
attr AlexaCookieService reading21OExpr BEGIN { require FHEM::AlexaCookieService::IntervalCheck;; };; FHEM::AlexaCookieService::IntervalCheck::summary_for_devices($name,AttrVal($name,"echodevice",""),refresh_min_age_hours=>$val)

# Prefer the newest meaningful reading: current status wins over stale command responses.
attr AlexaCookieService stateFormat {my $status_age=ReadingsAge($name,"service_ok",999999);; my $best_age=$status_age;; my $state="";; my $ok=ReadingsVal($name,"service_ok","");; my $age=ReadingsVal($name,"service_age_hours","");; my $updated=ReadingsVal($name,"service_updated_at","");; my $page=ReadingsVal($name,"amazon_page","");; $state=$ok ne "1" ? "service offline" : ($age ne "" ? "age ${age}h" : ($updated ne "" ? "updated ${updated}" : ($page ne "" ? $page : "ready")));; my @candidates=(["refresh_message",""],["refresh_action",""],["last_error","error: "],["login_url","login: "]);; for my $candidate (@candidates) { my ($reading,$prefix)=@{$candidate};; my $value=ReadingsVal($name,$reading,"");; next if $value eq "";; my $candidate_age=ReadingsAge($name,$reading,999999);; if ($candidate_age <= $best_age) { $state="${prefix}${value}";; $best_age=$candidate_age;; } };; $state}
