name: Update FHEM controls

on:
  push:
    branches:
      - "**"
    paths:
      - "lib/FHEM/AlexaCookieService/*.pm"
      - ".github/workflows/update-controls.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FHEM controls file
        uses: fhem/fhem-controls-actions@v4.0.0b1
        with:
          filename: lib/controls_alexa-cookie-service.txt
          directory: lib/FHEM/AlexaCookieService
          extension: .pm
          writemode: w

      - name: Commit controls file
        run: |
          if git diff --quiet -- lib/controls_alexa-cookie-service.txt; then
            echo "Controls file is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controls_alexa-cookie-service.txt
          git commit -m "Update FHEM controls file [skip ci]"
          git push
